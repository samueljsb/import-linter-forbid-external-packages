name: build and publish

on:
  pull_request:
  push:
    tags:
      - v*

# Only allow one instance of this workflow for each PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hynek/build-and-inspect-python-package@d44ca7d91762de7a7d5436ddae667c6da6d1c3df # v2.18.0

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: github.repository_owner == 'samueljsb' && github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".github/workflows/.python-version"
          cache: "pip"
      - run: python -m pip install .
      - id: package_version
        run: echo "version=$(python -c "from importlib.metadata import version; print(version('import-linter-forbid-external-packages'))")" >> "$GITHUB_OUTPUT"
      - name: check package version matches tag
        run: |
          [ "v${{ steps.package_version.outputs.version }}" = "${{ github.ref_name }}" ]
      - name: check changelog includes version
        run: grep '## \[${{ steps.package_version.outputs.version }}\]' < CHANGELOG.md

  pypi:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    needs: [build, verify]
    if: github.repository_owner == 'samueljsb' && github.ref_type == 'tag'
    environment: publish

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
