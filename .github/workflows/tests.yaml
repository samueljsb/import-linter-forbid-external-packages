name: tests

on:
  pull_request:
  push:
    branches: [main]

# Only allow one instance of this workflow for each PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15
          allow-prereleases: true
      - run: python -m pip install --group test_runners
      - run: tox run-parallel --parallel-no-spinner
        env:
          FORCE_COLOR: true
          TOX_OVERRIDE: testenv:mypy.set_env+=TERM=xterm-256color

  validate_commits:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: |
          git fetch origin main
          git branch main origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".github/workflows/.python-version"
          cache: "pip"
      - run: python -m pip install validate-commits
      - run: validate-commits
